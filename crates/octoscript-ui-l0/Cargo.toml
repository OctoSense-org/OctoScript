[package]
name = "octoscript-ui-l0"
version = "0.1.0"
edition = "2021"
description = "UI Profile Level 0: check, realize and dispatch LLM-authored Octoscript cards"
license = "Apache-2.0"

# No VM dependency: hosts can use the profile across Makepad lineages.
[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
blake3 = "1.8"

[dev-dependencies]
serde_json = "1"
