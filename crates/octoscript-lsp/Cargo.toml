[package]
name = "octoscript-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language server for canonical Octoscript source"

[lints]
workspace = true

[dependencies]
lsp-server = "0.9.0"
lsp-types = "0.97.0"
serde_json = "1.0.150"
octoscript-core = { path = "../octoscript-core" }

[dev-dependencies]
octoscript-capabilities = { path = "../octoscript-capabilities", default-features = false }
octoscript-schema = { path = "../octoscript-schema", default-features = false }
octoscript-workflow = { path = "../octoscript-workflow", default-features = false }
