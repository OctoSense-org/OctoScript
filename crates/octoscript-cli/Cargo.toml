[package]
name = "octoscript-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line runner for Octoscript scripts"

[lints]
workspace = true

[[bin]]
name = "octoscript"
path = "src/main.rs"

[dependencies]
# The `octoscript` binary owns its whole dependency graph, so it keeps exact
# schema number bounds (serde_json arbitrary_precision) on.
octoscript-capabilities = { path = "../octoscript-capabilities", features = ["exact-numbers"] }
octoscript-core = { path = "../octoscript-core" }
octoscript-workflow = { version = "0.1.0", path = "../octoscript-workflow", features = ["exact-numbers"] }

[dev-dependencies]
serde_json = "1.0.150"
